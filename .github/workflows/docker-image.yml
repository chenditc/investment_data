name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Select immutable and production image tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            echo 'chenditc/investment_data:sha-${{ github.sha }}'
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo 'chenditc/investment_data:latest'
            fi
            echo EOF
          } >>"$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            INVESTMENT_DATA_REVISION=${{ github.sha }}
          tags: ${{ steps.image-tags.outputs.value }}
