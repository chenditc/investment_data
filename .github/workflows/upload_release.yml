name: Upload latest data to github release

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        default: publish
        options:
          - publish
          - validate
          - repair-2026-07-20
  schedule:
    - cron: '47 10 * * *' # 18:47 Asia/Shanghai: early fresh-data opportunity
    - cron: '17 11,12 * * *' # 19:17 and 20:17 Asia/Shanghai: staggered fallbacks

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'investment-data-dolt-volume' || format('investment-data-dolt-volume-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      OPERATION: ${{ github.event_name == 'schedule' && 'publish' || inputs.operation }}

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decide whether publication is needed
        id: publication-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "publish" ]]; then
            mode="$(bash release_gate.sh)"
          else
            mode=build
          fi
          [[ "$mode" == "publish" || "$mode" == "validate-existing" \
            || "$mode" == "skip" || "$mode" == "build" ]]
          printf 'mode=%s\n' "$mode" >>"$GITHUB_OUTPUT"
          printf 'Publication gate mode: %s\n' "$mode"

      - name: Resolve the newest cached Dolt snapshot
        if: ${{ steps.publication-gate.outputs.mode == 'publish' || steps.publication-gate.outputs.mode == 'build' }}
        id: dolt-cache-key
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: investment-data-dolt-v2-${{ runner.os }}-
        shell: bash
        run: |
          set -euo pipefail
          cache_key=""
          if cache_keys="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/caches" \
              -f ref="$GITHUB_REF" \
              -f key="$CACHE_PREFIX" \
              -f sort=created_at \
              -f direction=desc \
              -f per_page=100 \
              --jq '.actions_caches | sort_by(.created_at) | reverse | .[].key'
          )"; then
            while IFS= read -r candidate; do
              suffix="${candidate#"$CACHE_PREFIX"}"
              if [[ "$candidate" == "$CACHE_PREFIX"* && "$suffix" =~ ^[0-9a-v]{32}$ ]]; then
                cache_key="$candidate"
                break
              fi
            done <<<"$cache_keys"
          else
            echo "::notice::Cache inventory unavailable; using the cold-clone fallback."
          fi
          printf 'key=%s\n' "$cache_key" >>"$GITHUB_OUTPUT"
          if [[ -n "$cache_key" ]]; then
            printf 'Resolved cache key: %s\n' "$cache_key"
          else
            echo "No verified snapshot cache is available for this ref."
          fi

      - name: Restore the newest verified Dolt snapshot
        if: ${{ (steps.publication-gate.outputs.mode == 'publish' || steps.publication-gate.outputs.mode == 'build') && steps.dolt-cache-key.outputs.key != '' }}
        id: dolt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/investment-data-dolt
          key: ${{ steps.dolt-cache-key.outputs.key }}

      - name: Resolve and verify immutable publication image
        if: ${{ steps.publication-gate.outputs.mode != 'skip' }}
        id: image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "chenditc/investment_data" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$OPERATION" == "publish" || "$OPERATION" == "validate" || "$OPERATION" == "repair-2026-07-20" ]]
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            [[ "$OPERATION" == "publish" ]]
          fi
          if [[ "$OPERATION" != "validate" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          fi

          image_tag="chenditc/investment_data:sha-${GITHUB_SHA}"
          for attempt in 1 2 3; do
            docker pull "$image_tag" && break
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          image_digest="$(docker image inspect "$image_tag" --format '{{json .RepoDigests}}' \
            | jq -er '[.[] | select(test("^chenditc/investment_data@sha256:[0-9a-f]{64}$"))] | if length == 1 then .[0] | split("@")[1] else error("ambiguous digest") end')"
          repository_revision="$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          qlib_revision="$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "io.chenditc.investment-data.qlib-revision" }}')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$repository_revision" == "$GITHUB_SHA" ]]
          [[ "$qlib_revision" == "b87a2c294d364a33fb739359886acffe8ec907d1" ]]
          printf 'digest=%s\n' "$image_digest" >>"$GITHUB_OUTPUT"
          printf 'repository_revision=%s\n' "$repository_revision" >>"$GITHUB_OUTPUT"
          printf 'qlib_revision=%s\n' "$qlib_revision" >>"$GITHUB_OUTPUT"

      - name: Build, validate, and publish release assets
        if: ${{ steps.publication-gate.outputs.mode != 'skip' }}
        shell: bash
        env:
          PUBLICATION_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PUBLICATION_BAKED_REPOSITORY_REVISION: ${{ steps.image.outputs.repository_revision }}
          PUBLICATION_BAKED_QLIB_REVISION: ${{ steps.image.outputs.qlib_revision }}
        run: |
          set -euo pipefail
          docker rm -f upload_tar >/dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/investment-data-dolt" "$RUNNER_TEMP/release-output"
          df -h "$RUNNER_TEMP"
          free -h

          args=()
          if [[ "$OPERATION" == "repair-2026-07-20" ]]; then
            args=(repair-2026-07-20)
          elif [[ "${{ steps.publication-gate.outputs.mode }}" == "validate-existing" ]]; then
            args=(validate-existing)
          fi

          cleanup() {
            docker rm -f upload_tar >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          container_command=(bash upload_release.sh "${args[@]}")
          if [[ "$OPERATION" == "validate" ]]; then
            container_command=(bash -lc '
              set -euo pipefail
              OUTPUT_DIR=/output bash dump_qlib_bin.sh
              python3 qlib/validate_archive.py \
                --archive /output/qlib_bin.tar.gz \
                --manifest /output/qlib_bin.manifest.json \
                --expected-tag "$(TZ=Asia/Shanghai date +%F)"
              sha256sum /output/qlib_bin.tar.gz
              cat /output/qlib_bin.manifest.json
            ')
          fi

          docker run --name upload_tar --rm \
            --memory=12g --memory-swap=12g \
            -v "$RUNNER_TEMP/investment-data-dolt:/dolt" \
            -v "$RUNNER_TEMP/release-output:/output" \
            -e HTTP_PROXY -e http_proxy -e HTTPS_PROXY -e https_proxy -e NO_PROXY -e no_proxy \
            -e GITHUB_ACTIONS -e GITHUB_EVENT_NAME -e GITHUB_REPOSITORY -e GITHUB_REF \
            -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_TOKEN \
            -e PUBLICATION_IMAGE_DIGEST \
            -e PUBLICATION_BAKED_REPOSITORY_REVISION \
            -e PUBLICATION_BAKED_QLIB_REVISION \
            -e MALLOC_ARENA_MAX=2 \
            -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -e NUMEXPR_NUM_THREADS=1 \
            "chenditc/investment_data@${PUBLICATION_IMAGE_DIGEST}" \
            "${container_command[@]}" &
          run_pid=$!

          (
            while kill -0 "$run_pid" 2>/dev/null; do
              date -u
              docker stats --no-stream \
                --format 'memory={{.MemUsage}} cpu={{.CPUPerc}} block={{.BlockIO}}' \
                upload_tar || true
              df -h "$RUNNER_TEMP"
              sleep 30
            done
          ) &
          monitor_pid=$!

          set +e
          wait "$run_pid"
          status=$?
          set -e
          kill "$monitor_pid" >/dev/null 2>&1 || true
          wait "$monitor_pid" >/dev/null 2>&1 || true
          exit "$status"

      - name: Verify the build snapshot
        if: ${{ steps.publication-gate.outputs.mode == 'publish' || steps.publication-gate.outputs.mode == 'build' }}
        id: snapshot
        env:
          PUBLICATION_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(
            docker run --rm \
              --memory=4g --memory-swap=4g \
              -v "$RUNNER_TEMP/investment-data-dolt:/dolt" \
              "chenditc/investment_data@${PUBLICATION_IMAGE_DIGEST}" \
              bash -lc '
                set -euo pipefail
                cd /dolt/investment_data
                status="$(dolt status)"
                grep -q "nothing to commit, working tree clean" <<<"$status"
                commit="$(dolt sql -r csv -q "SELECT DOLT_HASHOF('\''HEAD'\'') AS value" | tail -n 1 | tr -d "\r")"
                max_date="$(dolt sql -r csv -q "SELECT MAX(tradedate) AS value FROM final_a_stock_eod_price" | tail -n 1 | tr -d "\r")"
                [[ "$commit" =~ ^[0-9a-v]{32}$ ]]
                [[ "$max_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
                printf "%s,%s\n" "$commit" "$max_date"
              '
          )"
          IFS=, read -r commit max_date <<<"$snapshot"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
          printf 'max_date=%s\n' "$max_date" >>"$GITHUB_OUTPUT"
          printf 'Verified build snapshot commit=%s max_date=%s\n' "$commit" "$max_date"

      - name: Check whether the verified snapshot is already cached
        if: ${{ steps.publication-gate.outputs.mode == 'publish' || steps.publication-gate.outputs.mode == 'build' }}
        id: verified-cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: investment-data-dolt-v2-${{ runner.os }}-${{ steps.snapshot.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          exists=unknown
          if cache_keys="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/caches" \
              -f ref="$GITHUB_REF" \
              -f key="$CACHE_KEY" \
              -f per_page=100 \
              --jq '.actions_caches[].key'
          )"; then
            exists=false
            if grep -Fqx -- "$CACHE_KEY" <<<"$cache_keys"; then
              exists=true
            fi
          else
            echo "::notice::Cache inventory unavailable; relying on the restore result."
          fi
          printf 'exists=%s\n' "$exists" >>"$GITHUB_OUTPUT"
          printf 'Verified snapshot cache exists: %s\n' "$exists"

      - name: Make the snapshot readable by the cache service
        if: ${{ steps.publication-gate.outputs.mode == 'publish' || steps.publication-gate.outputs.mode == 'build' }}
        env:
          PUBLICATION_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/investment-data-dolt:/dolt" \
            "chenditc/investment_data@${PUBLICATION_IMAGE_DIGEST}" \
            chmod -R a+rX /dolt

      - name: Save the verified Dolt snapshot
        if: ${{ (steps.publication-gate.outputs.mode == 'publish' || steps.publication-gate.outputs.mode == 'build') && steps.dolt-cache.outputs.cache-matched-key != format('investment-data-dolt-v2-{0}-{1}', runner.os, steps.snapshot.outputs.commit) && steps.verified-cache.outputs.exists != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/investment-data-dolt
          key: investment-data-dolt-v2-${{ runner.os }}-${{ steps.snapshot.outputs.commit }}
