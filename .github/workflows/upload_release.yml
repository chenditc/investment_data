name: Upload latest data to github release

on:
  workflow_dispatch:
  # schedule:
  #   - cron:  '0 10 * * *'

jobs:

  build:

    runs-on: self-hosted

    steps:
    - name: Get current date
      id: t1
      uses: Kaven-Universe/github-action-current-date-time@v1
      with:
        format: "YYYY-MM-DD"
    - name: Save current date
      id: date
      run: echo "date=${{ steps.t1.outputs.time }}" >> $GITHUB_OUTPUT
    - name: Build qlib binary archive
      run: |
        set -euo pipefail
        docker rm -f upload_tar >/dev/null 2>&1 || true
        docker run --rm --name upload_tar --pull always \
          -v "${{ github.workspace }}:/output" \
          -v dolt-vol:/dolt \
          -e HTTP_PROXY \
          -e http_proxy \
          -e HTTPS_PROXY \
          -e https_proxy \
          -e NO_PROXY \
          -e no_proxy \
          -e CHECK_FRESHNESS=1 \
          chenditc/investment_data:latest \
          bash -lc 'set -euo pipefail
          git config --global http.proxy "${http_proxy:-}"
          git config --global https.proxy "${https_proxy:-}"
          bash dump_qlib_bin.sh
          ls -lh /output/'
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GH_TOKEN }}
        file: ${{ github.workspace }}/qlib_bin.tar.gz
        asset_name: qlib_bin.tar.gz
        tag: ${{ steps.date.outputs.date }}
        overwrite: true
        body: "Daily update release"
