name: Read-only adjustment evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect provider evidence with verified production image
        env:
          TUSHARE: ${{ secrets.TUSHARE }}
        shell: bash
        run: |
          set -euo pipefail
          image='chenditc/investment_data@sha256:5035cee1e34e98c86e535a3af630e8a8260fb037650cbb2bb5afa1f27d8eeb4e'
          docker pull "$image"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = '90789a07e5ca750efeb1589a7422d4d91bc49b19'
          mkdir -p "$RUNNER_TEMP/provider-evidence"
          docker run --rm -e TUSHARE \
            -v "$GITHUB_WORKSPACE/ops/capture_provider_evidence.py:/diagnostic.py:ro" \
            -v "$RUNNER_TEMP/provider-evidence:/evidence" \
            "$image" python3 /diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: provider-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-evidence/
          if-no-files-found: error
          retention-days: 7
