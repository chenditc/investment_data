name: Repair source data on a Dolt branch
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: plan
        options: [plan, apply]
        required: true
concurrency:
  group: investment-data-dolt-volume
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned source snapshot
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/investment-data-dolt
          key: investment-data-dolt-v2-Linux-kl67hfmqtpko9f0kjnu0hqdutjbvvkqs
      - name: Download immutable public repair inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42469384443 --repo chenditc/investment_data --name source-diagnosis --dir "$RUNNER_TEMP/repair-inputs/factors"
          gh run download 42469829545 --repo chenditc/investment_data --name source-diagnosis --dir "$RUNNER_TEMP/repair-inputs/indices"
      - name: Validate and prepare or apply source correction
        env:
          OPERATION: ${{ inputs.operation }}
          DOLT_CONFIG_GLOBAL_JSON: ${{ secrets.DOLT_CONFIG_GLOBAL_JSON }}
          DOLT_JWK: ${{ secrets.DOLT_JWK }}
        shell: bash
        run: |
          set -euo pipefail
          image=chenditc/investment_data@sha256:1d37877121fc820167c1679b65fcdb068ba74ab3a3c64f3d4d08214fd1f0d895
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/repair-output" "$RUNNER_TEMP/investment-data-dolt"
          docker run --rm --memory=12g --memory-swap=12g             -v "$RUNNER_TEMP/investment-data-dolt:/dolt"             -v "$GITHUB_WORKSPACE:/repair:ro"             -v "$RUNNER_TEMP/repair-inputs:/inputs:ro"             -v "$RUNNER_TEMP/repair-output:/output"             -e OPERATION -e DOLT_CONFIG_GLOBAL_JSON -e DOLT_JWK             "$image" bash /repair/ops/run_source_repair.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-repair-plan
          path: ${{ runner.temp }}/repair-output/
          retention-days: 14
