name: Diagnose issue 163 (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: investment-data-issue163-probe
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch authoritative public market inputs
        env:
          TUSHARE: ${{ secrets.TUSHARE }}
        run: |
          set -euo pipefail
          image=chenditc/investment_data@sha256:5d4840439689ce1e01961797d89b37d28b7ae9b41378922f9a58355fe3a1200a
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/issue163"
          docker run --rm --memory=2g --memory-swap=2g \
            -v "$GITHUB_WORKSPACE:/repair:ro" \
            -v "$RUNNER_TEMP/issue163:/output" \
            -e TUSHARE "$image" python3 /repair/ops/probe_issue_163.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue163-source-inputs
          path: ${{ runner.temp }}/issue163/
          retention-days: 14
