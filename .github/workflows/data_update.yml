name: Diagnose Tushare sources (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source client
        run: python -m pip install tushare==1.2.89
      - name: Read current adjustment histories and index snapshots
        env:
          TUSHARE: ${{ secrets.TUSHARE }}
        run: python ops/collect_repair_inputs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-diagnosis
          path: source-diagnosis/
          retention-days: 7
